<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050608" />

  <title>19 MotorWorks | Launching Soon</title>
  <meta
    name="description"
    content="19 MotorWorks — Driven by Loyalty, Built by Community. Launching soon."
  />

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="launch-page">

    <div class="ambient-glow glow-one"></div>
    <div class="ambient-glow glow-two"></div>

    <section class="launch-card" aria-label="19 MotorWorks Launching Soon">

      <div class="logo-wrap">
        <img
          src="assets/19-motorworks-banner.jpg"
          alt="19 MotorWorks — Driven by Loyalty, Built by Community"
          class="brand-image"
        />
      </div>

      <div class="divider"></div>

      <div class="launch-badge">
        <span class="pulse-dot"></span>
        <span>LAUNCHING SOON</span>
      </div>

      <h1>Something Powerful Is Coming.</h1>

      <p class="intro">
        19 MotorWorks is getting ready to open its doors.
        Stay tuned for the full workshop experience.
      </p>

      <div class="countdown" aria-label="Countdown to launch">
        <div class="time-box">
          <span id="days">00</span>
          <small>DAYS</small>
        </div>
        <div class="time-box">
          <span id="hours">00</span>
          <small>HOURS</small>
        </div>
        <div class="time-box">
          <span id="minutes">00</span>
          <small>MINUTES</small>
        </div>
        <div class="time-box">
          <span id="seconds">00</span>
          <small>SECONDS</small>
        </div>
      </div>

      <p class="tagline">
        DRIVEN BY LOYALTY <span>•</span> BUILT BY COMMUNITY
      </p>

    </section>

    <footer>
      © <span id="year"></span> 19 MotorWorks. All rights reserved.
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
